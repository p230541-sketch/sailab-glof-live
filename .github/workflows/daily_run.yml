name: SailAb GLOF Daily Pipeline Run

on:
  schedule:
    # 18:00 UTC = 23:00 Pakistan time, every night (agreed with the project owner, 2026-11-08).
    # Sentinel-2 passes over both lakes at about 05:59 UTC and Earth Engine usually takes some hours
    # to ingest a new scene, so an evening run normally sees that day's pass.
    - cron: '0 18 * * *'
  workflow_dispatch: {}       # manual trigger as well, e.g. for a live demo

permissions:
  contents: write             # needed to commit the updated database and logs back to the repository

concurrency:
  group: sailab-pipeline      # never two runs writing the same database at once
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04      # pinned: the system our first successful run used (ubuntu-latest is moving to 26)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5          # Node 24 version (v4 used deprecated Node 20)

      - uses: actions/setup-python@v6      # Node 24 version (v5 used deprecated Node 20)
        with:
          python-version: '3.13'   # the version every test and live run so far used

      - run: pip install -r requirements.txt

      - name: Run the test suite first (a broken build must not write to the database)
        run: python -m pytest tests/ -q

      - name: Run the pipeline
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/run_once.py   # exits 1 on any recorded error, so this run shows as failed

      - name: Commit the updated database and logs (also after a failed run, so failures stay visible)
        if: always()
        run: |
          git config user.name "SailAb GLOF Bot"
          git config user.email "actions@github.com"
          # -A also records a deleted resume file after a successful resumed run; .gitignore keeps
          # everything else (caches, local backfill images) out.
          git add -A
          git diff --staged --quiet || git commit -m "Automated run: $(date -u +%Y-%m-%dT%H:%M:%SZ) (${{ job.status }})"
          # If someone pushed while this run was working (e.g. a docs commit), put the bot's commit on
          # top instead of failing the push. Human commits never touch sailab_glof.db, so this cannot conflict
          # on the database; if it ever does conflict, the step fails visibly rather than overwriting anything.
          git pull --rebase origin main
          git push
